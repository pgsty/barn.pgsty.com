quickstart:
  eyebrow: Quick start
  title: Your first Linux VM
  desc: >-
    On a fresh host, `barn up` writes a one-node `barn.yml` and asks once
    before it changes the host.
  facts:
    - { label: Node, value: '`meta` at `10.10.10.10`' }
    - { label: Image, value: 'Ubuntu 24.04 · `u24:stable`' }
    - { label: Size, value: 2 vCPUs · 4 GiB memory }
    - { label: Disks, value: '64 GiB root · 128 GiB `/data`' }
  links:
    - { label: Installation options, url: docs/start/installation/ }
    - { label: Linux quick start, url: docs/start/tutorial/ }
  demo: |-
    {{< asciinema file="images/barn-first-run.cast" title="Barn 1.1.0 first run · Ubuntu 26.04" poster="npt:0:23.64" >}}

    A real first run on an Ubuntu 26.04 host; the image download and boot wait play faster than real time.
  body: |-
    ```bash {title="macOS · Homebrew"}
    # Installs the CLI, Barn.app, and QEMU
    brew install pgsty/infra/barn
    barn up
    barn ssh
    ```

    ```bash {title="Linux · install.sh"}
    # Installs into ~/.local/bin without sudo
    curl -fLO https://github.com/pgsty/barn/releases/latest/download/install.sh
    bash install.sh && export PATH="$HOME/.local/bin:$PATH"
    barn up
    barn ssh
    ```

capabilities:
  eyebrow: Core capabilities
  title: Two workflows. One CLI.
  text: Declarative Linux labs and native macOS machines share one install.
  items:
    - ref: Linux labs
      title: Declarative Linux Labs
      url: docs/start/tutorial/
      motto: One YAML inventory for fixed-IP nodes
      bullets:
        - 'Nodes, CPU, memory, and disks in one [`barn.yml`](docs/reference/configuration/)'
        - 'Fixed private IPs, SSH keys, and `/etc/hosts` wired in'
        - 'Re-run [`barn up`](docs/reference/cli/) to converge; deletion stays explicit'
      value: Pass the same file to Pigsty or `ansible-playbook -i`.
      visual:
        type: code
        aria_label: A four-node barn.yml inventory started with barn up
        title: barn.yml  ·  barn up
        lines:
          - { class: c, prefix: '# barn init full', text: '' }
          - { class: k, prefix: 'all:', text: '' }
          - { class: k, prefix: '  vars: ', text: '{ admin_ip: 10.10.10.10 }' }
          - { class: k, prefix: '  children:', text: '' }
          - { class: k, prefix: '    nodes:', text: '' }
          - { class: k, prefix: '      hosts:', text: '' }
          - { class: k, prefix: '        10.10.10.10: ', text: '{ nodename: meta }' }
          - { class: k, prefix: '        10.10.10.11: ', text: '{ nodename: node-1 }' }
          - { class: k, prefix: '        10.10.10.12: ', text: '{ nodename: node-2 }' }
          - { class: k, prefix: '        10.10.10.13: ', text: '{ nodename: node-3 }' }
          - { class: p, prefix: '$ ', text: 'barn up' }
          - { class: p, prefix: '$ ', text: 'barn ssh meta' }
    - ref: macOS guests
      title: Native macOS Machines
      url: docs/start/macos/
      motto: Isolated Apple Silicon guests on Apple Virtualization
      bullets:
        - 'Signed `Barn.app` ships with Homebrew and the arm64 archive'
        - 'One macOS 27 base from Apple; new machines clone in seconds'
        - 'Desktop window, [`ssh`](docs/reference/mac/), shared folders, and clipboard'
      value: Each machine has its own disk, keys, and private subnet.
      visual:
        type: code
        aria_label: Create, open, and connect to a macOS virtual machine
        title: barn mac  ·  Apple Virtualization
        lines:
          - { class: p, prefix: '$ ', text: 'barn mac up dev --cpu 8 --memory 16G --share ~/src' }
          - { class: p, prefix: '$ ', text: 'barn mac open dev' }
          - { class: p, prefix: '$ ', text: 'barn mac ssh dev -- sw_vers -productVersion' }
          - { class: c, prefix: '', text: '27.0' }
    - ref: Guest images
      title: Verified Guest Images
      url: docs/start/images/
      motto: 'Signed catalog `2026110502` · 9 releases · 17 artifacts'
      bullets:
        - 'Ubuntu, Debian, and Rocky Linux on `amd64` and `arm64`'
        - 'Signed metadata, SHA-256, and qcow2 checks before boot'
        - 'Cached once in `~/.barn`; each node gets its own overlay'
      value: Import your own qcow2 with `barn image import`.
      visual:
        type: components
        aria_label: Guest operating systems and their image aliases
        columns: 2
        items:
          - { icon: fa-brands fa-ubuntu, title: Ubuntu, detail: 'u22 · u24 · u26', url: docs/reference/images/ }
          - { icon: fa-brands fa-debian, title: Debian, detail: 'd12 · d13', url: docs/reference/images/ }
          - { icon: fa-brands fa-redhat, title: Rocky Linux, detail: 'el8 · el9 · el10', url: docs/reference/images/ }
          - { icon: fa-solid fa-server, title: CentOS 7, detail: 'el7 · amd64 Linux hosts', url: docs/reference/images/ }
          - { icon: fa-brands fa-apple, title: macOS 27, detail: 'Apple restore image', url: docs/start/macos/ }
          - { icon: fa-solid fa-file-import, title: Your own qcow2, detail: 'barn image import', url: docs/start/images/ }

design:
  eyebrow: Design notes
  title: Predictable by design
  desc: Each rule links to the note that explains its trade-offs.
  columns: 3
  items:
    - icon: fa-solid fa-network-wired
      title: Fixed IPs on a second NIC
      desc: Management egress and the fixed lab network never share an interface.
      url: blog/design/fixed-ip-two-nics/
    - icon: fa-solid fa-house-chimney
      title: One deployment per user
      desc: Each user keeps one Linux lab under `~/.barn`; switching directories never forks it.
      url: blog/design/one-deployment-no-projects/
    - icon: fa-solid fa-shield-halved
      title: Omission never deletes
      desc: A host removed from YAML is only reported; deleting a VM always takes `barn destroy`.
      url: blog/design/convergence-without-surprise/
    - icon: fa-solid fa-fingerprint
      title: Identity before PID
      desc: Barn signals or deletes a VM only after its QMP identity and journal agree.
      url: blog/design/identity-before-pid/
    - icon: fa-solid fa-file-signature
      title: Signed image evidence
      desc: '`repo.yaml` states intent; the signed `catalog.json` proves the bytes.'
      url: blog/design/repo-yaml-catalog-json/
    - icon: fa-solid fa-microchip
      title: Native or emulated guests
      desc: Matching guests use HVF or KVM; a foreign architecture runs under QEMU TCG.
      url: blog/design/multi-architecture-boundary/

faq:
  eyebrow: Before you begin
  title: Common questions
  style: flat
  items:
    - question: What hosts does Barn support?
      answer: >-
        Linux labs run on macOS (Apple Silicon or Intel, QEMU with HVF) and on
        Linux (`amd64` or `arm64`, QEMU with KVM). macOS guests need an Apple
        Silicon Mac running macOS 27 or later; the signed `Barn.app` ships with
        the Homebrew formula and the Darwin `arm64` archive. See
        [Platforms and Limits](docs/about/status/).
    - question: What does Barn change on my host?
      answer: >-
        The first `barn up` lists the QEMU packages, UEFI firmware, and private
        host network it needs, then asks once before applying them; `sudo`
        prompts only for steps that need it. Preview the plan with
        `barn setup --dry-run`, and see [Uninstall and Clean Up](docs/start/uninstall/)
        to reverse it.
    - question: How does Barn relate to Pigsty and Ansible?
      answer: >-
        `barn.yml` is a standard Ansible YAML inventory (`all.vars`,
        `all.children.<group>.hosts`), so the same file works with
        `ansible-playbook -i barn.yml` and Pigsty playbooks. Barn prepares the
        machines and SSH access; Pigsty installs the services. Barn also works
        on its own.
    - question: Where does Barn store images and VM disks?
      answer: >-
        Deployment state, SSH keys, cached base images, and VM disks live under
        `$BARN_HOME` (`~/.barn` by default). Changing your working directory
        does not create a separate deployment unless you set a different
        `BARN_HOME`.
    - question: How do I upgrade Barn?
      answer: >-
        Stop any running macOS VMs, then run `brew upgrade pgsty/infra/barn` or
        re-run `install.sh`. VM disks, keys, and state under `~/.barn` stay in
        place. See [Upgrade Barn](docs/start/installation/#upgrade-barn).

