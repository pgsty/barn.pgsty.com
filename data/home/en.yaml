  detail:
    label: What's new in 0.9.2
    url: blog/release/0.9.2/

capabilities:
  eyebrow: Core capabilities
  title: Two workflows. One CLI.
  text: Declarative Linux labs and native macOS machines.
  items:
    - ref: 01 / LINUX LABS
      title: Declarative Linux Labs
      url: docs/start/tutorial/
      motto: One YAML inventory for 1 to 20 fixed-IP nodes
      bullets:
        - 'Declare CPU, memory, and disks in [`barn.yml`](docs/reference/configuration/)'
        - 'Fixed private IPs with prewired SSH and `/etc/hosts`'
        - 'Re-run [`barn up`](docs/reference/cli/) to converge guest changes in place'
      value: Built for Pigsty, Ansible, and cluster testing.
      visual:
        type: code
        aria_label: Declare a 3-node Linux lab in barn.yml and boot it
        title: barn.yml  →  barn up
        lines:
          - { class: c, prefix: '# 3-node Linux lab in barn.yml', text: '' }
          - { class: k, prefix: 'pg-test: ', text: '{ hosts: { 10.10.10.11: {}, 10.10.10.12: {}, 10.10.10.13: {} } }' }
          - { class: p, prefix: '$ ', text: 'barn up' }
          - { class: ok, prefix: '✓ ', text: 'node-1  10.10.10.11  u24-arm64  4 vCPU · 8 GiB  ready' }
          - { class: ok, prefix: '✓ ', text: 'node-2  10.10.10.12  u24-arm64  4 vCPU · 8 GiB  ready' }
          - { class: ok, prefix: '✓ ', text: 'node-3  10.10.10.13  u24-arm64  4 vCPU · 8 GiB  ready' }
          - { class: p, prefix: '$ ', text: 'barn ssh 10.10.10.11' }
    - ref: 02 / NATIVE MACOS
      title: Native macOS Machines
      url: docs/start/macos/
      motto: Isolated Apple Silicon guests via Virtualization
      bullets:
        - 'Signed `Barn.app` included in Homebrew and release archives'
        - 'Clone macOS 27+ VMs in seconds on APFS storage'
        - 'Cocoa desktop window, [`ssh`](docs/reference/mac/), VirtioFS shares, and clipboard'
      value: Test macOS builds without polluting your host.
      visual:
        type: code
        aria_label: Boot and open an isolated macOS virtual machine on Apple Silicon
        title: barn mac  ·  Apple Virtualization
        lines:
          - { class: p, prefix: '$ ', text: 'barn mac up dev --cpu 4 --mem 8 --share ~/work' }
          - { class: ok, prefix: '✓ ', text: 'macOS 27 runtime ready  ·  APFS copy-on-write clone' }
          - { class: ok, prefix: '✓ ', text: 'dev  192.168.64.5  running  VirtioFS: work' }
          - { class: p, prefix: '$ ', text: 'barn mac open dev' }
          - { class: p, prefix: '$ ', text: 'barn mac ssh dev -- uname -mr' }
          - { class: c, prefix: '  ', text: '26.0.0 arm64' }
    - ref: 03 / GUEST CATALOG
      title: Verified Guest Images
      url: docs/start/images/
      motto: 41 signed Linux images across nine distributions
      bullets:
        - 'Ubuntu, Debian, Rocky, Alma, Oracle, and CentOS'
        - 'Verified by signed manifests and SHA-256 digests'
        - 'Cached once under `~/.barn`, cloned on every boot'
      value: Or import custom qcow2 images in one command.
      visual:
        type: components
        aria_label: Supported guest operating systems and architectures
        columns: 2
        items:
          - { icon: fa-brands fa-ubuntu, title: Ubuntu, detail: '22.04 · 24.04 · 26.04', url: docs/start/images/ }
          - { icon: fa-brands fa-debian, title: Debian, detail: '12 · 13', url: docs/start/images/ }
          - { icon: fa-brands fa-redhat, title: Rocky & Alma, detail: 'EL 8 · 9 · 10', url: docs/start/images/ }
          - { icon: fa-solid fa-server, title: Oracle & CentOS, detail: 'EL 8 · 9 · 10', url: docs/start/images/ }
          - { icon: fa-brands fa-apple, title: Native macOS, detail: 'macOS 27+ · Apple Silicon', url: docs/start/macos/ }
          - { icon: fa-solid fa-clone, title: Copy-on-Write, detail: 'qcow2 & APFS clones', url: docs/reference/images/ }

steps:
  eyebrow: Quick start
  title: Up and running in three commands
  desc: Install the CLI, boot a Linux lab or native macOS machine, and connect over SSH.
  items:
    - icon: fa-solid fa-download
      title: Install Barn
      desc: Install via Homebrew on macOS, or run the [installer script](docs/start/installation/) on Linux.
      cmd:
        code: brew install pgsty/infra/barn
    - icon: fa-solid fa-terminal
      title: Boot a Linux lab
      desc: Start the default Ubuntu node or a [`barn.yml` lab](docs/start/tutorial/) and connect via SSH.
      cmd:
        code: barn up && barn ssh
    - icon: fa-brands fa-apple
      title: Run native macOS
      desc: Launch an isolated [macOS 27+ guest](docs/start/macos/) on Apple Silicon with shared folders.
      cmd:
        code: barn mac up dev --share ~/work

principles:
  eyebrow: Engineering principles
  title: Predictable by default
  desc: Four design choices keep local virtual machines fast, reproducible, and easy to reason about.
  columns: 4
  items:
    - icon: fa-solid fa-location-dot
      title: Fixed private IPs
      desc: Every node keeps its inventory IP, with SSH keys and /etc/hosts wired automatically.
    - icon: fa-solid fa-file-code
      title: One YAML inventory
      desc: Use one standard Ansible YAML file for both Barn VMs and Pigsty playbooks.
    - icon: fa-solid fa-arrows-rotate
      title: Safe convergence
      desc: Re-run barn up to reconcile guests in place; VMs restart only on CPU or RAM changes.
    - icon: fa-solid fa-clone
      title: Copy-on-write disks
      desc: Base images stay cached once under ~/.barn; new nodes clone in seconds.

faq:
  eyebrow: Before you begin
  title: Common questions
  flat: true
  items:
    - question: What hosts does Barn support?
      answer: >-
        Linux labs run on macOS (Apple Silicon and Intel via QEMU + HVF) and
        Linux (`amd64` and `arm64` via QEMU + KVM). Native macOS VMs (`barn mac`)
        run on Apple Silicon Macs with macOS 27+, and the signed and notarized
        `Barn.app` ships directly in the Homebrew formula and Darwin `arm64`
        release archive. See the [platform support matrix](docs/about/status/).
    - question: How does Barn relate to Pigsty and Ansible?
      answer: >-
        `barn.yml` uses the standard Ansible YAML inventory schema (`all.vars`,
        `all.children.<group>.hosts`). You can pass the same file directly to
        `ansible-playbook -i barn.yml` or Pigsty deployment playbooks without
        maintaining a separate VM config.
    - question: Where does Barn store images and VM disks?
      answer: >-
        All deployment state, SSH keys, cached base images, and VM disks live
        under `$BARN_HOME` (`~/.barn` by default). Changing your working
        directory does not create a separate deployment unless you set a
        different `BARN_HOME`.
    - question: Why does GitHub Releases show 0.9.2 as a pre-release?
      answer: >-
        All Barn `0.x` builds are published as GitHub pre-releases while the
        CLI contract approaches `1.0`. Pin `v0.9.2` explicitly when downloading
        release assets or running `install.sh`.

