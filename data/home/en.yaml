faq:
  eyebrow: Short answers
  title: Before you begin
  items:
    - question: Is the working directory still a Barn project?
      answer: No. State is one deployment under ~/.barn. An explicit or discovered Inventory supplies desired state; without one, lifecycle commands can fall back to the applied spec.
      open: true
    - question: Can I use pigsty.yml directly?
      answer: Yes. Barn consumes the documented VM fields plus a small naming, control-node, and node-admin whitelist; other Pigsty settings stay opaque.
    - question: Does the first up modify the host?
      answer: It can install missing dependencies and fixed-IP networking, requesting sudo when needed. Use setup --dry-run to inspect the host plan first. The optional hosts helper is installed only by hosts install.
    - question: Does up install PostgreSQL or Pigsty?
      answer: It prepares the virtual machines and guest access. Deploy PostgreSQL and other services separately with Pigsty; the built-in templates describe VM topology.
    - question: Is Barn ready for production?
      answer: No. It is a pre-1.0 local development runtime; read the status page for the exact verified matrix and open release gates.

