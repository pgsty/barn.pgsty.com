workflows:
  eyebrow: Choose your environment
  title: Virtual machines for everyday development
  columns: 2
  link_label: Get started
  items:
    - title: A Linux lab, from one file
      meta: On macOS and Linux
      icon: fa-brands fa-linux
      desc: >-
        Test a PostgreSQL cluster, reproduce a bug, or try a new distribution.
        Define up to 20 nodes with fixed IPs and SSH access in one YAML inventory.
        The same inventory works with Pigsty.
      url: docs/start/tutorial/
    - title: A separate macOS environment
      meta: On Apple Silicon · macOS 27+
      icon: fa-brands fa-apple
      desc: >-
        Build and test in a separate macOS environment with its own disk and identity.
        Use the desktop or SSH, and share folders and text with your Mac.
        New VMs reuse a shared base image.
      url: docs/start/macos/

first_command:
  eyebrow: Install → Start → Connect
  title: Your first Linux VM
  text: >-
    Select your host OS to install Barn 0.9.1, start the VM,
    and connect. On a fresh setup, Barn creates a one-node Ubuntu 24.04 lab.
    Barn shows the required host changes and requests administrator access when needed.
  body: |-
    ```bash {tab="macOS" group="barn-install" value="macos"}
    brew install pgsty/infra/barn

    barn up
    barn ssh
    ```

    ```bash {tab="Linux" value="linux" wrap=true}
    curl -fLO https://github.com/pgsty/barn/releases/download/v0.9.1/install.sh
    BARN_VERSION=0.9.1 bash install.sh
    export PATH="$HOME/.local/bin:$PATH"

    barn up
    barn ssh
    ```

    If a lab already exists, `barn up` resumes it.
    [Installation options and requirements](docs/start/installation/) · [macOS VM guide](docs/start/macos/)

features:
  eyebrow: Repeatable operations
  title: Configure and manage your lab
  columns: 4
  items:
    - { icon: fa-solid fa-network-wired, title: Stable addresses, desc: Linux nodes keep the IPs in your inventory. Reach databases and services directly from the host and other nodes. }
    - { icon: fa-solid fa-file-code, title: One configuration, desc: Keep VM definitions in your Ansible inventory. Use it with Barn to create machines and Pigsty to deploy services. }
    - { icon: fa-solid fa-arrows-rotate, title: Repeatable operations, desc: 'Run up again to finish interrupted setup. Use plan to preview configuration changes, then recreate affected VMs when needed.' }
    - { icon: fa-solid fa-clone, title: Reusable images, desc: Linux uses verified qcow2 base images. macOS VMs clone a base installed from Apple's restore image. Each VM has a separate writable disk. }

faq:
  title: Before you begin
  items:
    - question: Which host do I need?
      answer: 'Linux guests run on arm64 or amd64 hosts with macOS or Linux. QEMU uses HVF or KVM for native acceleration. macOS guests require Apple Silicon, macOS 27 or later, and the native Barn.app component. See [platforms and limits](docs/about/status/).'
      open: true
    - question: Do I need Pigsty?
      answer: 'No. Barn works on its own for Linux and macOS development. For a PostgreSQL lab, use the same Linux inventory with [Pigsty](https://pigsty.io/). Barn prepares VMs and access, and Pigsty installs the services.'
    - question: What happens when I edit the inventory?
      answer: 'For Linux labs, use plan to see changes. Up adds new nodes, but changes to existing VM definitions require recreate. A VM stays in place when you remove its host from the inventory. Use destroy to delete it.'
    - question: Can I keep several macOS machines?
      answer: 'Yes. Give them names and start the ones you need. Up to two macOS VMs can run at once per Mac, including VMs from other tools. You can keep more stopped machines.'

