workflows:
  eyebrow: Choose your environment
  title: Virtual machines for everyday development
  columns: 2
  link_label: Get started
  items:
    - title: A Linux lab, from one file
      meta: On macOS and Linux
      icon: fa-brands fa-linux
      desc: >-
        Test a PostgreSQL cluster, reproduce a bug, or try a new distribution.
        Define up to 20 nodes in one YAML inventory, with stable IPs and SSH
        ready to use. The same inventory works with Pigsty.
      url: docs/start/tutorial/
    - title: A fresh Mac for your next build
      meta: On Apple Silicon · macOS 27+
      icon: fa-brands fa-apple
      desc: >-
        Build and test in an independent macOS environment. Open its desktop,
        connect over SSH, and share folders and text with your Mac.
        New machines reuse a shared base; each keeps its own disk and identity.
      url: docs/start/macos/

first_command:
  eyebrow: Install → Start → Connect
  title: Your first Linux VM
  text: >-
    Choose your host OS below, then install, start, and connect. On a fresh setup,
    Barn creates a one-node Ubuntu 24.04 lab and prepares the host dependencies.
    It shows host changes and requests administrator access when needed.
  body: |-
    ```bash {tab="macOS" group="barn-install" value="macos"}
    brew install pgsty/infra/barn

    barn up
    barn ssh
    ```

    ```bash {tab="Linux" value="linux" wrap=true}
    curl -fLO https://github.com/pgsty/barn/releases/download/v0.9.0/install.sh
    BARN_VERSION=0.9.0 bash install.sh
    export PATH="$HOME/.local/bin:$PATH"

    barn up
    barn ssh
    ```

    Use Homebrew on macOS or the download installer on Linux. Already have a lab? `barn up` resumes it.
    [Installation options and requirements](docs/start/installation/) · [macOS VM guide](docs/start/macos/)

features:
  eyebrow: Built for repeatable work
  title: A lab you can understand and control
  columns: 4
  items:
    - { icon: fa-solid fa-network-wired, title: Stable addresses, desc: Linux nodes keep the IPs in your inventory. Reach databases and services directly from the host and other nodes. }
    - { icon: fa-solid fa-file-code, title: One configuration, desc: Keep VM definitions in your Ansible inventory. Use it with Barn to create machines and Pigsty to deploy services. }
    - { icon: fa-solid fa-arrows-rotate, title: Repeatable operations, desc: Repeat up to finish interrupted setup. Review changes with plan; recreate and delete machines explicitly. }
    - { icon: fa-solid fa-clone, title: Reusable images, desc: Linux uses verified qcow2 bases. macOS machines clone a base installed from Apple's restore image, with separate writable disks. }

faq:
  title: Before you begin
  items:
    - question: Which host do I need?
      answer: 'Linux guests run on macOS or Linux, on arm64 or amd64, using QEMU with HVF or KVM. macOS guests require Apple Silicon, macOS 27 or later, and the native Barn Mac component. See [platforms and limits](docs/about/status/).'
      open: true
    - question: Do I need Pigsty?
      answer: 'No. Barn works on its own for Linux and macOS development. For a PostgreSQL lab, use the same Linux inventory with [Pigsty](https://pigsty.io/). Barn prepares machines and access; Pigsty installs the services.'
    - question: What happens when I edit the inventory?
      answer: 'For Linux labs, plan shows the changes. Up adds new nodes; changes to existing VM definitions require recreate. Removing a host from the file leaves its VM intact until you explicitly destroy it.'
    - question: Can I keep several macOS machines?
      answer: 'Yes. Give them names and start the ones you need. Apple allows two macOS VMs running at a time per Mac, including other tools. Each Barn Mac machine has an independent network and state, separate from the Linux lab.'

