hero:
  eyebrow: Barn 0.9.1 · Pre-release · Apache-2.0
  title_lines:
    - Local virtual machines.
    - Linux and macOS.
  title_size: 3.8rem
  lead: >-
    Create a Linux lab from one YAML inventory, or run a separate macOS machine
    for builds and tests. Connect through SSH and manage your VMs from the command line.
  note: Bootstrap And Run Nodes. An open-source tool for local development.
  note_icon: fa-solid fa-terminal
  image:
    src: images/barn-hero.svg
    alt: A red Barn with servers in its doorway beside a blue Silo at dusk
  actions:
    - { label: Start a Linux lab, url: docs/start/tutorial/, icon: fa-solid fa-terminal, style: primary }
    - { label: Run a macOS VM, url: docs/start/macos/, icon: fa-brands fa-apple, style: ghost }
  detail:
    label: What's new in 0.9.1
    url: blog/release/0.9.1/
