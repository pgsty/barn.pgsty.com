  title_lines:
    - words:
        - { text: Launch Local VM Fleets }
    - words:
        - { text: Across Linux and macOS }
  title_size: 3.3rem
  lead: >-
    Boot multi-node Linux labs from an Ansible inventory on macOS and Linux, or
    run isolated native macOS machines on Apple Silicon.
  note: Bootstrap And Run Nodes · HVF & KVM · Apple Virtualization
  image:
    src: images/barn-hero.svg
    alt: A red Barn with servers in its doorway beside a blue Silo at dusk
  media:
    ratio: 1.08fr 0.92fr
    max_width: 520px
    hide_below: lg
  actions:
    - { label: Start a Linux lab, url: docs/start/tutorial/, icon: fa-solid fa-terminal, style: primary }
    - { label: Run a macOS VM, url: docs/start/macos/, icon: fa-brands fa-apple, style: ghost }
