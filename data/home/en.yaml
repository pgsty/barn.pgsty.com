first_command:
  eyebrow: Normal path
  title: Start the lab, then connect
  text: Prepare the Barn 0.9.0 candidate from source as described in the Quick Start, then run these commands in an empty directory on a terminal for your first deployment. Interactive up prepares missing host dependencies and creates the default inventory when no deployment exists.
  code: |-
    barn up
    barn ssh
  lang: bash
  note: Add host lines and run up again; new nodes are created, stopped selected nodes start, and running peers keep their processes while unfinished setup is retried. Removing a line never destroys a VM.

