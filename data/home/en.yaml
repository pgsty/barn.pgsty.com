hero:
  eyebrow: Barn 0.9.0 · Release candidate · Go + QEMU
  title_lines:
    - One inventory.
    - One deployment.
  title_size: 4.15rem
  lead: >-
    Barn boots a Pigsty-compatible inventory into fixed-IP QEMU virtual
    machines on macOS and Linux. Use the same inventory to provision your VMs
    with Barn and deploy services with Pigsty.
  note: Ubuntu 24.04 by default. Repeat barn up to continue interrupted setup and retry limited guest features without restarting healthy VMs.
  note_icon: fa-solid fa-flask
  image:
    light: images/barn-hero-light.svg?v=0.9.0
    dark: images/barn-hero-dark.svg?v=0.9.0
    alt: One Pigsty inventory becomes one fixed-IP Barn deployment
  actions:
    - { label: Quick Start, url: docs/start/tutorial/, icon: fa-solid fa-rocket, style: primary }
    - { label: Read the reference, url: docs/reference/, icon: fa-solid fa-book-open, style: ghost }
  detail:
    label: Native validation and limits
    url: docs/about/status/
    icon: fa-solid fa-list-check

