first_command:
  eyebrow: 安装 → 启动 → 连接
  title: 启动第一台 Linux 虚拟机
  text: >-
    按宿主操作系统选择安装命令，然后启动并连接。首次使用时，Barn 会创建一个
    Ubuntu 24.04 单节点环境，并准备宿主依赖。涉及宿主变更时会显示操作内容，
    在需要时请求管理员权限。
  body: |-
    ```bash {tab="macOS" group="barn-install" value="macos"}
    brew install pgsty/infra/barn

    barn up
    barn ssh
    ```

    ```bash {tab="Linux" value="linux" wrap=true}
    curl -fLO https://github.com/pgsty/barn/releases/download/v0.9.0/install.sh
    BARN_VERSION=0.9.0 bash install.sh
    export PATH="$HOME/.local/bin:$PATH"

    barn up
    barn ssh
    ```

    macOS 使用 Homebrew；Linux 使用下载安装脚本。已有环境时，`barn up` 会继续该部署。
    [安装方式与系统要求](docs/start/installation/) · [macOS 虚拟机教程](docs/start/macos/)

