faq:
  title: 开始之前
  items:
    - question: 需要什么样的宿主？
      answer: 'Linux 客机支持 macOS 和 Linux 宿主的 arm64、amd64 架构。QEMU 使用 HVF 或 KVM 提供原生加速。macOS 客机需要 Apple Silicon、macOS 27 或更高版本，以及 Barn.app 原生组件。详见[平台与限制](docs/about/status/)。'
      open: true
    - question: 必须搭配 Pigsty 吗？
      answer: '不需要。Barn 可以独立用于 Linux 与 macOS 开发。如果需要 PostgreSQL 实验环境，可将同一份 Linux 清单交给 [Pigsty](https://pigsty.cc/)。Barn 准备虚拟机与访问环境，Pigsty 安装服务。'
    - question: 修改主机清单后会发生什么？
      answer: '对于 Linux 部署，用 plan 查看变更。up 添加新节点，已有节点的定义变化则需要 recreate。从清单中移除主机不会删除虚拟机，需要执行 destroy。'
    - question: 可以保留多台 macOS 虚拟机吗？
      answer: '可以。为它们分别命名，再按需启动。每台 Mac 最多同时运行两台 macOS 虚拟机，包括其他工具启动的虚拟机。可以保留更多已停止的机器。'

