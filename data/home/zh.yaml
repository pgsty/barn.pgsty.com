    - 一套 Deployment。
  title_size: 4.15rem
  lead: >-
    Barn 在 macOS 与 Linux 上，把 Pigsty 兼容的 Inventory 启动成固定 IP 的
    QEMU 虚拟机。用同一份配置，通过 Barn 准备虚拟机，再通过 Pigsty 部署服务。
  note: 默认 Ubuntu 24.04。重复 barn up 可接续初始化、重试受限功能，健康 VM 保持运行。
