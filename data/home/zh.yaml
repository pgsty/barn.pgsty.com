faq:
  eyebrow: 简短回答
  title: 开始之前
  items:
    - question: 工作目录还是 Barn 项目吗？
      answer: 不是。状态是 ~/.barn 下唯一的一套 deployment；显式或当前目录发现的 Inventory 提供期望状态，没有文件时生命周期命令可回退到已应用规格。
      open: true
    - question: 可以直接使用 pigsty.yml 吗？
      answer: 可以。Barn 读取已记录的 VM 字段，以及用于命名、控制节点和管理员身份的一小组 Pigsty 字段；其余参数保持不透明。
    - question: 第一次 up 会修改宿主吗？
      answer: 可能安装缺少的依赖与固定 IP 网络，并在需要时调用 sudo。可先用 setup --dry-run 查看宿主计划；可选 hosts helper 仅在 hosts install 时安装。
    - question: up 会安装 PostgreSQL 或 Pigsty 吗？
      answer: 它准备虚拟机与客机访问环境。PostgreSQL 和其他服务由 Pigsty 单独部署；内置模板只描述 VM 拓扑。
    - question: Barn 可以用于生产吗？
      answer: 不可以。它仍是 pre-1.0 的本地开发运行时；请在状态页查看准确验证矩阵与开放门禁。

