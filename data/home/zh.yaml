first_command:
  eyebrow: 正常路径
  title: 启动环境，然后进入
  text: 先按快速上手从源码准备 Barn 0.9.0 候选；首次部署时，在终端的空目录执行以下命令。交互式 up 会准备缺少的宿主依赖，在尚无部署时生成默认配置。
  code: |-
    barn up
    barn ssh
  lang: bash
  note: 增加主机行后再次 up：创建新节点、启动选中的已停止节点，运行中节点保留进程，同时重试未完成的初始化；删掉一行永远不会删除 VM。

