    在 macOS 与 Linux 上用一份 Ansible 清单拉起多节点 Linux 实验环境，或在
    Apple Silicon 上运行相互隔离的原生 macOS 虚拟机。
  note: Bootstrap And Run Nodes · HVF 与 KVM · Apple Virtualization
  image:
