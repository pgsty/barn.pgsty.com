quickstart:
  eyebrow: 快速上手
  title: 一条命令，四台虚拟机
  desc: >-
    在 Mac 上装好 Barn，选择 Pigsty 的 `full` 模板，再运行 `barn up`。
    同一份 `pigsty.yml` 就能拉起四节点 Linux 实验环境。
  facts:
    - { label: 节点, value: '4 台虚拟机 · `10.10.10.10–13`' }
    - { label: 镜像, value: 'Ubuntu 24.04 · `u24:stable`' }
    - { label: 单机, value: 2 个 vCPU · 4 GiB 内存 }
    - { label: 磁盘, value: '64 GiB 根盘 · 128 GiB `/data`' }
  links:
    - { label: 安装选项, url: docs/start/installation/ }
    - { label: 与 Pigsty 配合使用, url: 'docs/start/automation/#pair-the-lab-with-pigsty' }
  demo: |-
    {{< asciinema file="images/barn-first-run.cast" title="macOS · Homebrew → Pigsty full" rows="18" fit="both" speed="1.25" idleTimeLimit="0.7" poster="npt:0:23.63" preload="true" >}}
  body: |-
    ```bash {title="macOS · Homebrew"}
    # 安装 CLI、Barn.app 与 QEMU
    brew install pgsty/infra/barn
    cd pigsty  # 已有的 Pigsty 源码目录
    ./configure -c full
    barn up
    barn status
    ```

    ```bash {title="Linux · 单节点快速上手"}
    # 安装到 ~/.local/bin，无需 sudo
    curl -fLO https://github.com/pgsty/barn/releases/latest/download/install.sh
    bash install.sh && export PATH="$HOME/.local/bin:$PATH"
    barn up
    barn ssh
    ```

capabilities:
  eyebrow: 核心能力
  title: 两套工作流，一个 CLI。
  text: 声明式 Linux 实验环境与原生 macOS 虚拟机，装一次即可使用。
  items:
    - ref: Linux 实验环境
      title: 声明式 Linux 实验环境
      url: docs/start/tutorial/
      motto: 一份 YAML 清单，拉起固定 IP 节点
      bullets:
        - '在 [`barn.yml`](docs/reference/configuration/) 中声明节点、CPU、内存与磁盘'
        - '固定私网 IP，自动配好 SSH 密钥与 `/etc/hosts`'
        - '重跑 [`barn up`](docs/reference/cli/) 即可收敛，删除始终显式执行'
      value: 同一份文件可以直接交给 Pigsty 或 `ansible-playbook -i`。
      visual:
        type: code
        aria_label: 用 barn up 启动四节点的 barn.yml 主机清单
        title: barn.yml  ·  barn up
        lines:
          - { class: c, prefix: '# barn init full', text: '' }
          - { class: k, prefix: 'all:', text: '' }
          - { class: k, prefix: '  vars: ', text: '{ admin_ip: 10.10.10.10 }' }
          - { class: k, prefix: '  children:', text: '' }
          - { class: k, prefix: '    nodes:', text: '' }
          - { class: k, prefix: '      hosts:', text: '' }
          - { class: k, prefix: '        10.10.10.10: ', text: '{ nodename: meta }' }
          - { class: k, prefix: '        10.10.10.11: ', text: '{ nodename: node-1 }' }
          - { class: k, prefix: '        10.10.10.12: ', text: '{ nodename: node-2 }' }
          - { class: k, prefix: '        10.10.10.13: ', text: '{ nodename: node-3 }' }
          - { class: p, prefix: '$ ', text: 'barn up' }
          - { class: p, prefix: '$ ', text: 'barn ssh meta' }
    - ref: macOS 客机
      title: 原生 macOS 虚拟机
      url: docs/start/macos/
      motto: 基于 Apple Virtualization 的隔离 Apple Silicon 客机
      bullets:
        - 'Homebrew 与 arm64 发行包已内置签名的 `Barn.app`'
        - '从 Apple 安装一份 macOS 27 母盘，新机器秒级克隆'
        - '桌面窗口、[`ssh`](docs/reference/mac/)、共享目录与剪贴板'
      value: 每台机器都有独立的磁盘、密钥与私有子网。
      visual:
        type: code
        aria_label: 创建、打开并连接一台 macOS 虚拟机
        title: barn mac  ·  Apple Virtualization
        lines:
          - { class: p, prefix: '$ ', text: 'barn mac up dev --cpu 8 --memory 16G --share ~/src' }
          - { class: p, prefix: '$ ', text: 'barn mac open dev' }
          - { class: p, prefix: '$ ', text: 'barn mac ssh dev -- sw_vers -productVersion' }
          - { class: c, prefix: '', text: '27.0' }
    - ref: 客机镜像
      title: 经过校验的客机镜像
      url: docs/start/images/
      motto: '签名目录 `2026110502` · 9 个发行版本 · 17 个镜像制品'
      bullets:
        - 'Ubuntu、Debian 与 Rocky Linux，覆盖 `amd64` 和 `arm64`'
        - '启动前校验签名元数据、SHA-256 与 qcow2 结构'
        - '在 `~/.barn` 中只缓存一份，每个节点使用独立写时复制层'
      value: 也可以用 `barn image import` 导入自己的 qcow2 镜像。
      visual:
        type: components
        aria_label: 客机操作系统及其镜像别名
        columns: 2
        items:
          - { icon: fa-brands fa-ubuntu, title: Ubuntu, detail: 'u22 · u24 · u26', url: docs/reference/images/ }
          - { icon: fa-brands fa-debian, title: Debian, detail: 'd12 · d13', url: docs/reference/images/ }
          - { icon: fa-brands fa-redhat, title: Rocky Linux, detail: 'el8 · el9 · el10', url: docs/reference/images/ }
          - { icon: fa-solid fa-server, title: CentOS 7, detail: 'el7 · 仅限 amd64 Linux 宿主', url: docs/reference/images/ }
          - { icon: fa-brands fa-apple, title: macOS 27, detail: 'Apple 恢复镜像', url: docs/start/macos/ }
          - { icon: fa-solid fa-file-import, title: 自有 qcow2, detail: 'barn image import', url: docs/start/images/ }

design:
  eyebrow: 设计随笔
  title: 可预期，来自设计
  desc: 每条规则都链接到一篇说明其取舍的设计随笔。
  columns: 3
  items:
    - icon: fa-solid fa-network-wired
      title: 固定 IP 走第二张网卡
      desc: 管理出网走第一张网卡，宿主、节点与 Pigsty 使用的固定地址走第二张。
      url: blog/design/fixed-ip-two-nics/
    - icon: fa-solid fa-house-chimney
      title: 每个用户一套部署
      desc: 每个用户只有一套实验环境，保存在 `~/.barn`，切换目录不会分出第二套。
      url: blog/design/one-deployment-no-projects/
    - icon: fa-solid fa-shield-halved
      title: 配置缺席不等于删除
      desc: 从 YAML 中移除的主机只会被报告，只有 `destroy` 才删除虚拟机。
      url: blog/design/convergence-without-surprise/
    - icon: fa-solid fa-fingerprint
      title: 先确认身份，再看 PID
      desc: QMP 身份与操作日志一致时，Barn 才会向虚拟机进程发信号或删除文件。
      url: blog/design/identity-before-pid/
    - icon: fa-solid fa-file-signature
      title: 镜像以签名为证
      desc: '`repo.yaml` 表达意图，签名的 `catalog.json` 证明镜像字节。'
      url: blog/design/repo-yaml-catalog-json/
    - icon: fa-solid fa-microchip
      title: 原生或模拟客机
      desc: 同架构客机使用 HVF 或 KVM，跨架构客机由 QEMU TCG 运行。
      url: blog/design/multi-architecture-boundary/

faq:
  eyebrow: 开始之前
  title: 常见问题
  style: flat
  items:
    - question: Barn 支持哪些宿主平台？
      answer: >-
        Linux 实验环境可运行在 macOS（Apple Silicon 或 Intel，QEMU 搭配 HVF）与
        Linux（`amd64` 或 `arm64`，QEMU 搭配 KVM）上。macOS 客机需要运行 macOS 27
        或更高版本的 Apple Silicon Mac，签名的 `Barn.app` 随 Homebrew 配方与
        Darwin `arm64` 归档一起提供。详见[平台与限制](docs/about/status/)。
    - question: Barn 会改动宿主上的哪些东西？
      answer: >-
        首次运行 `barn up` 时，Barn 会列出需要安装的 QEMU 软件包、UEFI 固件与私有宿主网络，确认一次后才会执行；只有需要管理员权限的步骤才会触发 `sudo`。可以先用
        `barn setup --dry-run` 预览计划，撤销方法见[卸载与清理](docs/start/uninstall/)。
    - question: Barn 与 Pigsty、Ansible 是什么关系？
      answer: >-
        `barn.yml` 就是标准的 Ansible YAML 主机清单（`all.vars`、
        `all.children.<group>.hosts`），同一份文件可以直接用于
        `ansible-playbook -i barn.yml` 和 Pigsty 剧本。Barn 负责准备机器与 SSH 访问，
        Pigsty 负责安装服务；Barn 也可以单独使用。
    - question: Barn 把镜像与虚拟机磁盘存放在哪里？
      answer: >-
        部署状态、SSH 密钥、基础镜像缓存与虚拟机磁盘都保存在 `$BARN_HOME`
        下（默认 `~/.barn`）。除非设置了不同的 `BARN_HOME`，切换工作目录不会新建另一套部署。
    - question: 如何升级 Barn？
      answer: >-
        先停止正在运行的 macOS 虚拟机，再执行 `brew upgrade pgsty/infra/barn` 或重新运行 `install.sh`。
        `~/.barn` 下的虚拟机磁盘、密钥和状态都会保留。详见[升级 Barn](docs/start/installation/#upgrade-barn)。

