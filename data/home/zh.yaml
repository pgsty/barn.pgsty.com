capabilities:
  eyebrow: 核心能力
  title: 两套工作流，一个 CLI。
  text: 声明式 Linux 实验集群与 Apple Silicon 原生 macOS 虚拟机。
  items:
    - ref: 01 / LINUX 实验集群
      title: 声明式 Linux 集群
      url: docs/start/tutorial/
      motto: 一份 YAML 清单，拉起 1 至 20 个固定 IP 节点
      bullets:
        - '在 [`barn.yml`](docs/reference/configuration/) 中按节点声明 CPU、内存与数据盘'
        - '自带固定私网 IP、免密 SSH 与 `/etc/hosts` 解析'
        - '修改配置后重跑 [`barn up`](docs/reference/cli/) 即可就地收敛状态'
      value: 直接复用同一份清单运行 Pigsty 与 Ansible 剧本。
      visual:
        type: code
        aria_label: 在 barn.yml 中声明三节点 Linux 实验环境并启动
        title: barn.yml  →  barn up
        lines:
          - { class: c, prefix: '# barn.yml 中的三节点 Linux 实验室', text: '' }
          - { class: k, prefix: 'pg-test: ', text: '{ hosts: { 10.10.10.11: {}, 10.10.10.12: {}, 10.10.10.13: {} } }' }
          - { class: p, prefix: '$ ', text: 'barn up' }
          - { class: ok, prefix: '✓ ', text: 'node-1  10.10.10.11  u24-arm64  4 vCPU · 8 GiB  ready' }
          - { class: ok, prefix: '✓ ', text: 'node-2  10.10.10.12  u24-arm64  4 vCPU · 8 GiB  ready' }
          - { class: ok, prefix: '✓ ', text: 'node-3  10.10.10.13  u24-arm64  4 vCPU · 8 GiB  ready' }
          - { class: p, prefix: '$ ', text: 'barn ssh 10.10.10.11' }
    - ref: 02 / 原生 MACOS
      title: 原生 macOS 虚拟机
      url: docs/start/macos/
      motto: 基于 Apple Virtualization 的隔离桌面与终端
      bullets:
        - 'Homebrew 与发行包内置已签名公证的 `Barn.app`'
        - '共享 macOS 27+ 母盘，APFS 写时复制秒级克隆'
        - '支持 [`barn mac open`](docs/reference/mac/) 原生窗口、SSH、目录共享与剪贴板'
      value: 在不污染宿主 Mac 的前提下验证安装包与构建产物。
      visual:
        type: code
        aria_label: 在 Apple Silicon 上创建并打开隔离的 macOS 虚拟机
        title: barn mac  ·  Apple Virtualization
        lines:
          - { class: p, prefix: '$ ', text: 'barn mac up dev --cpu 4 --mem 8 --share ~/work' }
          - { class: ok, prefix: '✓ ', text: 'macOS 27 runtime ready  ·  APFS copy-on-write clone' }
          - { class: ok, prefix: '✓ ', text: 'dev  192.168.64.5  running  VirtioFS: work' }
          - { class: p, prefix: '$ ', text: 'barn mac open dev' }
          - { class: p, prefix: '$ ', text: 'barn mac ssh dev -- uname -mr' }
          - { class: c, prefix: '  ', text: '26.0.0 arm64' }
    - ref: 03 / 客机镜像目录
      title: 签名校验客机镜像
      url: docs/start/images/
      motto: 覆盖九大 Linux 发行版系的 41 个官方镜像
      bullets:
        - '涵盖 Ubuntu、Debian、Rocky、Alma 与 Oracle'
        - '入库前强制通过签名清单与 SHA-256 摘要校验'
        - '全局缓存单份基础镜像，新节点秒级拉起'
      value: 亦可通过单条命令导入自定义 qcow2 镜像。
      visual:
        type: components
        aria_label: 支持的客机操作系统与架构
        columns: 2
        items:
          - { icon: fa-brands fa-ubuntu, title: Ubuntu, detail: '22.04 · 24.04 · 26.04', url: docs/start/images/ }
          - { icon: fa-brands fa-debian, title: Debian, detail: '12 · 13', url: docs/start/images/ }
          - { icon: fa-brands fa-redhat, title: Rocky & Alma, detail: 'EL 8 · 9 · 10', url: docs/start/images/ }
          - { icon: fa-solid fa-server, title: Oracle & CentOS, detail: 'EL 8 · 9 · 10', url: docs/start/images/ }
          - { icon: fa-brands fa-apple, title: 原生 macOS, detail: 'macOS 27+ · Apple Silicon', url: docs/start/macos/ }
          - { icon: fa-solid fa-clone, title: 写时复制, detail: 'qcow2 与 APFS 克隆', url: docs/reference/images/ }

steps:
  eyebrow: 快速上手
  title: 三条命令启动环境
  desc: 安装 CLI，拉起 Linux 实验节点或原生 macOS 虚拟机，并通过 SSH 连接。
  items:
    - icon: fa-solid fa-download
      title: 安装 Barn
      desc: macOS 可用 Homebrew 安装，Linux 可运行[安装脚本](docs/start/installation/)。
      cmd:
        code: brew install pgsty/infra/barn
    - icon: fa-solid fa-terminal
      title: 启动 Linux 实验室
      desc: 拉起默认 Ubuntu 节点或 [`barn.yml` 集群](docs/start/tutorial/)，并直连 SSH。
      cmd:
        code: barn up && barn ssh
    - icon: fa-brands fa-apple
      title: 运行原生 macOS
      desc: 在 Apple Silicon 上启动挂载共享目录的 [macOS 27+ 客机](docs/start/macos/)。
      cmd:
        code: barn mac up dev --share ~/work

principles:
  eyebrow: 工程原则
  title: 默认可预期
  desc: 四项核心设计取舍，让本地虚拟机始终保持快速、可复现、易排查。
  columns: 4
  items:
    - icon: fa-solid fa-location-dot
      title: 固定私网 IP
      desc: 节点始终保持清单声明的私网 IP，自动配齐 SSH 与 /etc/hosts。
    - icon: fa-solid fa-file-code
      title: 单份 YAML 清单
      desc: 同一份标准 Ansible YAML 清单，同时驱动 Barn 与 Pigsty。
    - icon: fa-solid fa-arrows-rotate
      title: 安全就地收敛
      desc: 重跑 barn up 即可在客机内就地收敛，仅在硬件变更时重启。
    - icon: fa-solid fa-clone
      title: 写时复制存储
      desc: 基础镜像在 ~/.barn 下只缓存一份，新节点数秒内完成克隆。

faq:
  eyebrow: 开始之前
  title: 常见问题
  flat: true
  items:
    - question: Barn 支持哪些宿主机平台？
      answer: >-
        Linux 实验环境支持 macOS（Apple Silicon 与 Intel，基于 QEMU + HVF）和
        Linux（`amd64` 与 `arm64`，基于 QEMU + KVM）。原生 macOS 虚拟机（`barn mac`）
        支持运行 macOS 27+ 的 Apple Silicon Mac，Homebrew 配方与 Darwin `arm64`
        发行归档已内置签名公证的 `Barn.app`。详见[平台支持矩阵](docs/about/status/)。
    - question: Barn 与 Pigsty、Ansible 是什么关系？
      answer: >-
        `barn.yml` 直接采用标准 Ansible YAML 清单结构（`all.vars`、
        `all.children.<group>.hosts`）。你可以将同一份清单直接传给
        `ansible-playbook -i barn.yml` 或 Pigsty 部署剧本，无需维护两套配置。
    - question: Barn 将镜像与虚拟机磁盘存放在哪里？
      answer: >-
        所有部署状态、SSH 密钥、基础镜像缓存与虚拟机磁盘均保存在 `$BARN_HOME`
        下（默认路径为 `~/.barn`）。除非显式指定不同的 `BARN_HOME`，切换工作目录不会新建另一套部署。
    - question: 为什么 GitHub Releases 将 0.9.2 标记为 pre-release？
      answer: >-
        在 CLI 契约演进至 `1.0` 之前，所有 Barn `0.x` 版本均作为 GitHub
        pre-release 发布。下载发布归档或运行 `install.sh` 时请显式固定 `v0.9.2`。

