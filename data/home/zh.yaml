first_command:
  eyebrow: 安装 → 启动 → 连接
  title: 启动第一台 Linux 虚拟机
  text: >-
    选择宿主操作系统。依次执行命令，安装 Barn 0.9.1、启动虚拟机并连接。
    首次使用时，Barn 创建 Ubuntu 24.04 单节点环境。
    Barn 准备宿主依赖并显示所需变更，在需要时请求管理员权限。
  body: |-
    ```bash {tab="macOS" group="barn-install" value="macos"}
    brew install pgsty/infra/barn

    barn up
    barn ssh
    ```

    ```bash {tab="Linux" value="linux" wrap=true}
    curl -fLO https://github.com/pgsty/barn/releases/download/v0.9.1/install.sh
    BARN_VERSION=0.9.1 bash install.sh
    export PATH="$HOME/.local/bin:$PATH"

    barn up
    barn ssh
    ```

    已有实验环境时，`barn up` 会继续该部署。
    [安装方式与系统要求](docs/start/installation/) · [macOS 虚拟机教程](docs/start/macos/)

features:
  eyebrow: 可重复操作
  title: 配置和管理实验环境
  columns: 4
  items:
    - { icon: fa-solid fa-network-wired, title: 固定地址, desc: Linux 节点使用清单中的 IP。宿主与其他节点可以直接连接数据库和服务。 }
