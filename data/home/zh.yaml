faq:
  title: 开始之前
  items:
    - question: 需要什么样的宿主？
      answer: 'Linux 客机支持 macOS 和 Linux 宿主的 arm64、amd64 架构，通过 QEMU 使用 HVF 或 KVM。macOS 客机需要 Apple Silicon、macOS 27 或更高版本，以及 Barn Mac 原生组件。详见[平台与限制](docs/about/status/)。'
      open: true
    - question: 必须搭配 Pigsty 吗？
      answer: '不需要。Barn 可以独立用于 Linux 与 macOS 开发。如果要搭建 PostgreSQL 实验环境，可以把同一份 Linux 主机清单交给 [Pigsty](https://pigsty.cc/)：Barn 准备机器与访问环境，Pigsty 安装服务。'
    - question: 修改主机清单后会发生什么？
      answer: '对于 Linux 环境，plan 会展示变更，up 会添加新节点；已有虚拟机的定义变化需要显式 recreate。从配置中删除主机行会保留对应虚拟机，只有 destroy 才会删除它。'
    - question: 可以保留多台 macOS 虚拟机吗？
      answer: '可以。为它们分别命名，再按需启动。Apple 允许每台 Mac 同时运行两台 macOS 虚拟机，这个限制也包含其他工具启动的机器。每台 Barn Mac 虚拟机都有独立网络与状态，与 Linux 实验环境分开管理。'

