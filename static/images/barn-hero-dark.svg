  <text x="228" y="194" fill="#fff" font-family="ui-sans-serif, system-ui" font-size="28" font-weight="800">BARN</text>
  <text x="228" y="224" fill="#c79baa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">inventory → VMs</text>
