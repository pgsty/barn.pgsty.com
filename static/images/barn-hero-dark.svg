    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect x="56" y="30" width="648" height="458" rx="34" fill="url(#panel)" stroke="#573642" stroke-width="2" filter="url(#shadow)"/>
  <path d="M116 117h528M116 399h528" stroke="#432c35" stroke-width="2"/>
