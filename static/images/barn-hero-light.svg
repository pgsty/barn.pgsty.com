  <text x="176" y="82" fill="#5c3341" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">barn up → barn ssh</text>
  <rect x="116" y="151" width="528" height="104" rx="22" fill="#fff" stroke="#d9c3ca" stroke-width="2"/>
  <rect x="140" y="175" width="64" height="56" rx="17" fill="url(#brand)"/>
  <circle cx="160" cy="199" r="4" fill="#ffd0da"/><circle cx="184" cy="199" r="4" fill="#ffd0da"/>
  <rect x="156" y="207" width="32" height="15" rx="8" fill="#f6adc0"/>
  <text x="228" y="194" fill="#371d27" font-family="ui-sans-serif, system-ui" font-size="28" font-weight="800">BARN</text>
  <text x="228" y="224" fill="#775563" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">inventory → VMs</text>
  <rect x="491" y="177" width="126" height="50" rx="14" fill="#f8edf1" stroke="#e2c9d1"/>
