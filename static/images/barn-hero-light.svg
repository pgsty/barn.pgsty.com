  <text x="140" y="313" fill="#371d27" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="750">macOS</text>
  <text x="140" y="342" fill="#775563" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">arm64 · amd64</text>
  <rect x="140" y="353" width="66" height="8" rx="4" fill="#df6685"/><text x="216" y="362" fill="#8d2747" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">HVF</text>
