<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Barn runtime architecture</title>
  <desc id="desc">Barn up prepares and starts native QEMU virtual machines on macOS and Linux; Barn ssh connects.</desc>
  <defs>
    <linearGradient id="panel" x1="88" y1="32" x2="670" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f7edf1"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7b1f40"/>
      <stop offset="1" stop-color="#dd5678"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6e263d" flood-opacity=".14"/></filter>
  </defs>
  <rect x="56" y="30" width="648" height="458" rx="34" fill="url(#panel)" stroke="#dcc7ce" stroke-width="2" filter="url(#shadow)"/>
  <path d="M116 117h528M116 399h528" stroke="#eadbe0" stroke-width="2"/>
